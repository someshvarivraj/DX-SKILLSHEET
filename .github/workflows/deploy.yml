# 体験環境への自動デプロイ。
#
# main への push をトリガーに、GitHub Actions が AWS に一時的な認証情報で
# ログインし（OIDC。長期のアクセスキーはどこにも保存しない）、SSM 経由で
# EC2 上のインスタンスに「git pull して再ビルド」を指示するだけである。
#
# 2026-10-07: デプロイのたびにDBマイグレーションも実行する（実行し忘れで
# 「列がない」エラーが何度か出たため）。新しいアプリを起動する前に実行する。
# あわせて古いビルドキャッシュと使われていないイメージを消し、ディスクが
# 一杯にならないようにする（20GBが97%まで埋まりビルドが失敗した）。
# db:seed は自動では実行しない（画面で追加した項目を消すことがあるため）。
# S3は使わない — インスタンス自身がGitHubから直接 `git fetch` する
# （リポジトリはprivateなので、インスタンス側にread-onlyのデプロイキーが
# 必要。docs/ci-cd/README.md 参照）。
#
# 一度きりのAWS側セットアップは docs/ci-cd/README.md を参照。本番の別AWSアカウント
# へ移すときは、そちらの手順を新アカウントでもう一度実行し、下の2つの
# リポジトリ変数（Settings → Secrets and variables → Actions → Variables）を
# 新しい値に差し替えるだけでよい。シークレットは一切使わない。
#
#   AWS_DEPLOY_ROLE_ARN  例: arn:aws:iam::514917275273:role/dx-skillsheet-github-deploy
#   DEPLOY_INSTANCE_ID   例: i-0521602aa68362440
#   AWS_REGION           例: ap-northeast-1（未設定なら体験環境の us-east-1）
#   DEPLOY_DIR           例: /opt/apps/skill-sheet-2（未設定なら体験環境の /opt/dx-skillsheet）

name: Deploy to trial EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # OIDCでAWSの一時認証情報を受け取るために必要
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC — 保存された鍵は使わない)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Trigger rebuild on EC2
        env:
          SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/dx-skillsheet' }}
        run: |
          set -e
          cat > /tmp/commands.json <<EOF
          {
            "commands": [
              "set -e",
              "cd ${DEPLOY_DIR}",
              "git fetch origin ${SHA}",
              "git reset --hard ${SHA}",
              "docker builder prune -af --filter until=24h || true",
              "docker compose -f docker-compose.prod.yml --env-file .env build app tools",
              "docker compose -f docker-compose.prod.yml --env-file .env run --rm tools npx prisma migrate deploy",
              "docker compose -f docker-compose.prod.yml --env-file .env up -d app",
              "docker image prune -af || true",
              "df -h / | tail -1",
              "echo DEPLOY_DONE"
            ]
          }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/commands.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          # A build plus migrations can take several minutes on the instance.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
                exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
